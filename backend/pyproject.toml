[project]
name = "ai-verilog-linter-backend"
version = "0.1.0"
description = "AI-powered Verilog linter backend (FastAPI + Pyverilog + LangChain/Groq)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
